# Railway / Nixpacks build.
# The Telegram bot (bot.py) and the Mini App server (server/index.js) SHARE one
# SQLite file, so they must run in the SAME container. start.sh launches both.

[phases.setup]
nixPkgs = ['nodejs_22', 'python311']

[phases.install]
cmds = [
  'python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt',
  'cd frontend && npm ci',
  'cd server && npm ci',
]

[phases.build]
cmds = ['cd frontend && npm run build']

[start]
cmd = 'bash start.sh'
